name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install datasette (observatory's one sanctioned dependency)
        run: pip install "datasette>=0.65"

      - name: Run offline test suites
        run: |
          python test_discovery.py
          python test_watch.py
          python test_observatory.py
